name: "git-pkgs update"
description: "Open pull requests for outdated dependencies"

inputs:
  ecosystem:
    description: "Filter to a specific ecosystem (e.g. npm, cargo, bundler)"
    required: false
    default: ""
  limit:
    description: "Maximum number of pull requests to open per run"
    required: false
    default: "5"
  branch-prefix:
    description: "Prefix for branches created by this action"
    required: false
    default: "git-pkgs/"
  labels:
    description: "Comma-separated labels to apply to created pull requests"
    required: false
    default: "dependencies"
  base:
    description: "Base branch for pull requests. Defaults to the repository default branch."
    required: false
    default: ""
  token:
    description: "GitHub token for pushing branches and opening pull requests."
    required: false
    default: ${{ github.token }}

outputs:
  opened:
    description: "Number of pull requests opened"
    value: ${{ steps.update.outputs.opened }}
  outdated:
    description: "Total number of outdated dependencies found"
    value: ${{ steps.outdated.outputs.count }}

runs:
  using: "composite"
  steps:
    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Find outdated dependencies
      id: outdated
      shell: bash
      env:
        ECOSYSTEM: ${{ inputs.ecosystem }}
      run: |
        args=(--format=json)
        if [ -n "${ECOSYSTEM}" ]; then
          args+=(--ecosystem "${ECOSYSTEM}")
        fi

        raw=$(git-pkgs outdated "${args[@]}" 2>&1) || true
        if ! outdated=$(jq -c 'if type == "array" then . else [] end' <<<"${raw}" 2>/dev/null); then
          outdated="[]"
        fi

        count=$(jq 'length' <<<"${outdated}")
        echo "count=${count}" >> "$GITHUB_OUTPUT"
        echo "Found ${count} outdated dependencies"

        echo "json<<GITPKGS_EOF" >> "$GITHUB_OUTPUT"
        echo "${outdated}" >> "$GITHUB_OUTPUT"
        echo "GITPKGS_EOF" >> "$GITHUB_OUTPUT"

    - name: Open pull requests
      id: update
      if: steps.outdated.outputs.count != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTDATED: ${{ steps.outdated.outputs.json }}
        LIMIT: ${{ inputs.limit }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        LABELS: ${{ inputs.labels }}
        BASE_INPUT: ${{ inputs.base }}
        REPO: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        base="${BASE_INPUT:-${DEFAULT_BRANCH}}"
        start_ref=$(git rev-parse HEAD)
        opened=0

        open_prs=$(gh pr list --repo "${REPO}" --state open --json headRefName --jq '.[].headRefName')

        while IFS= read -r dep; do
          if [ "${opened}" -ge "${LIMIT}" ]; then
            echo "Reached limit of ${LIMIT} pull requests"
            break
          fi

          name=$(jq -r '.name' <<<"${dep}")
          ecosystem=$(jq -r '.ecosystem' <<<"${dep}")
          current=$(jq -r '.current_version' <<<"${dep}")
          latest=$(jq -r '.latest_version' <<<"${dep}")

          slug=$(printf '%s' "${name}" | tr -c 'A-Za-z0-9._-' '-')
          branch="${BRANCH_PREFIX}${ecosystem}-${slug}-${latest}"

          if grep -qxF "${branch}" <<<"${open_prs}"; then
            echo "Skipping ${name}: PR already open on ${branch}"
            continue
          fi

          echo "::group::${name} ${current} -> ${latest}"

          git checkout -B "${branch}" "${start_ref}"

          if ! git-pkgs update "${name}" --ecosystem "${ecosystem}" --quiet; then
            echo "::warning::git-pkgs update failed for ${name}"
            git checkout -f "${start_ref}"
            echo "::endgroup::"
            continue
          fi

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes after updating ${name}"
            git checkout -f "${start_ref}"
            echo "::endgroup::"
            continue
          fi

          title="Update ${name} from ${current} to ${latest}"
          git add -A
          git commit -m "${title}"
          git push --force origin "${branch}"

          changelog=$(git-pkgs changelog "${name}" --ecosystem "${ecosystem}" \
            --from "${current}" --to "${latest}" 2>/dev/null || true)

          body="Updates \`${name}\` from ${current} to ${latest}."
          if [ -n "${changelog}" ]; then
            body+=$'\n\n<details>\n<summary>Changelog</summary>\n\n```\n'
            body+="${changelog}"
            body+=$'\n```\n\n</details>'
          fi
          body+=$'\n\n*Generated by [git-pkgs](https://github.com/git-pkgs/git-pkgs)*'

          gh_args=(--repo "${REPO}" --head "${branch}" --base "${base}" --title "${title}" --body "${body}")
          if [ -n "${LABELS}" ]; then
            gh_args+=(--label "${LABELS}")
          fi

          if gh pr create "${gh_args[@]}"; then
            opened=$((opened + 1))
          else
            echo "::warning::failed to open PR for ${name}"
          fi

          git checkout -f "${start_ref}"
          echo "::endgroup::"
        done < <(jq -c '.[]' <<<"${OUTDATED}")

        echo "opened=${opened}" >> "$GITHUB_OUTPUT"
        echo "Opened ${opened} pull requests"
