name: "git-pkgs diff"
description: "Comment on PRs with a summary of dependency changes"

inputs:
  base:
    description: "Base ref to compare from. Defaults to the PR base branch."
    required: false
    default: ""
  head:
    description: "Head ref to compare to. Defaults to the PR head."
    required: false
    default: "HEAD"
  token:
    description: "GitHub token for commenting on PRs."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Determine base ref
      id: refs
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        GITHUB_BASE_REF: ${{ github.event.pull_request.base.sha }}
      run: |
        base="${INPUT_BASE}"
        if [ -z "${base}" ]; then
          base="${GITHUB_BASE_REF}"
        fi
        echo "base=${base}" >> "$GITHUB_OUTPUT"

    - name: Generate diff
      id: diff
      shell: bash
      env:
        BASE: ${{ steps.refs.outputs.base }}
        HEAD: ${{ inputs.head }}
      run: |
        output=$(git-pkgs diff "${BASE}..${HEAD}" 2>&1) || true

        if [ -z "${output}" ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "body<<GITPKGS_EOF"
            echo "### Dependency Changes"
            echo ""
            echo '```'
            echo "${output}"
            echo '```'
            echo ""
            echo "*Generated by [git-pkgs](https://github.com/git-pkgs/git-pkgs)*"
            echo "GITPKGS_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Find existing comment
      if: steps.diff.outputs.has_changes == 'true'
      id: find-comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        comment_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq '.[] | select(.body | startswith("### Dependency Changes")) | .id' \
          | head -1)
        echo "comment_id=${comment_id}" >> "$GITHUB_OUTPUT"

    - name: Create or update comment
      if: steps.diff.outputs.has_changes == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_ID: ${{ steps.find-comment.outputs.comment_id }}
        BODY: ${{ steps.diff.outputs.body }}
      run: |
        if [ -n "${COMMENT_ID}" ]; then
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            --method PATCH \
            --field body="${BODY}"
        else
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --method POST \
            --field body="${BODY}"
        fi
